name: Build and Release DMF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create GitHub Release?"
        type: boolean
        required: true
        default: false
      version:
        description: "Override version (optional, e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            $tag = "${{ github.event.inputs.version }}"
          } else {
            $csproj = Get-Content DMF.csproj | Select-String '<Version>(.*?)<\/Version>'
            if ($csproj) {
              $tag = "v" + $csproj.Matches.Groups[1].Value
            } else {
              $tag = "v0.0.0"
            }
          }
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish DMF (win-x64, single file, self-contained)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=embedded `
            -p:DebugSymbols=false `
            -p:Version=${{ env.VERSION }} `
            -o ./publish

      - name: Archive published files
        run: |
          $zipName = "DMF-${{ env.VERSION }}-win-x64.zip"
          Compress-Archive -Path ./publish/* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact (optional, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: DMF-${{ env.VERSION }}-win-x64
          path: ./publish

      - name: Create GitHub Release
        if: |
          github.event_name == 'push' && github.ref_type == 'tag' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.make_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          tag_name: ${{ env.TAG }}
          name: DMF ${{ env.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
